    <line x1="432" y1="160" x2="478" y2="160" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
    <line x1="432" y1="176" x2="465" y2="176" stroke="#EAB308" stroke-width="4" stroke-linecap="round"/>
  </g>
