name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Build
        run: pnpm build
        env:
          # Placeholder values for build-time env validation (layout.tsx calls getServerEnv()
          # during static prerendering). Real secrets are only needed at runtime, not at build
          # time, and must be configured separately in the deployment environment.
          LIVEBLOCKS_SECRET_KEY: sk_placeholder_for_ci_build
          NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: pk_placeholder_for_ci_build
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
